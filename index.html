<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style/style.css" />
    <link rel="stylesheet" href="./style/catalog.css" />
    <link rel="stylesheet" href="./style/heading.css" />
    <link rel="stylesheet" href="./style/buttons.css" />
    <link rel="stylesheet" href="./style/products.css" />
    <link rel="stylesheet" href="./style/card.css" />
    <link rel="stylesheet" href="./style/footer.css" />
    <title>Cards Training</title>
  </head>
  <body>
    <main class="catalog">
      <div class="catalog__container container">
        <h1 class="catalog__heading heading">Выбери свой продукт</h1>
        <div class="catalog__buttons">
          <button type="button" class="buttons__first button">
            Изменить цвет первой карточки
          </button>
          <button type="button" class="buttons__all button">
            Изменить цвет всех карточек
          </button>
          <button type="button" class="buttons__google button">
            Загуглить
          </button>
          <button type="button" class="buttons__reset button">Сбросить</button>
        </div>
        <ul class="catalog__products products clear-list">
          <template class="card__template">
            <li class="products__card card">
              <img src="" alt="Увлажняющий мусс" class="card__image" />
              <span class="card__type"></span>
              <h2 class="card__title"></h2>
              <p class="card__description text-main"></p>
              <div class="card__list">
                <span class="card__list-name text-main">Состав:</span>
                <ul class="card__list-items text-main"></ul>
              </div>
              <div class="card__price">
                <b>Цена</b>
                <span></span>
              </div>
              <button type="button" class="card__button button">
                В корзину
              </button>
            </li>
          </template>
        </ul>
      </div>
      <footer class="catalog__footer">
        <div class="footer__container">
          <div class="footer__info">
            <h2 class="footer__header">Product Cards</h2>
            <p class="footer__text">У нас самые лучшие продукты для кожи!</p>
            <div class="footer__icons">
              <a class="footer__icon" href="">
                <img src="./icons/telegram-icon.png" alt="telegram-icon" />
              </a>
              <a class="footer__icon" href="">
                <img src="./icons/vk-icon.png" alt="vk-icon" />
              </a>
            </div>
          </div>
          <div class="footer__form-block">
            <p class="footer__label">Подпишись на наши акции:</p>
            <form class="form" action="">
              <input
                class="form__input"
                type="email"
                name="email"
                placeholder="Введи Email..."
                required
              />
              <button class="form__button" type="submit">Подписаться</button>
            </form>
            <button type="button" class="form__sign-up button">Регистрация</button>
            <div class="overlay">
              <div class="modal">
                <form class="modal__form form" action="">
                  <h2 class="modal__heading center">Регистрация</h2>
                  <div class="form__group">
                    <label for="name" class="form__label">Имя:</label>
                    <input
                      class="form__input"
                      type="text"
                      id="name"
                      name="name"
                      placeholder="Введи свое имя"
                      required
                    />
                  </div>
                  <div class="form__group">
                    <label for="surname" class="form__label">Фамилия:</label>
                    <input
                      class="form__input"
                      type="text"
                      id="surname"
                      name="surname"
                      placeholder="Введи свою фамилию"
                      required
                    />
                  </div>
                  <div class="form__group">
                    <label for="birthday" class="form__label"
                      >Дата рождения:</label
                    >
                    <input
                      class="form__input"
                      type="date"
                      id="birthday"
                      name="birthday"
                      placeholder="Дата рождения"
                      required
                    />
                  </div>
                  <div class="form__group">
                    <label for="login" class="form__label">Логин:</label>
                    <input
                      class="form__input"
                      type="text"
                      id="login"
                      name="login"
                      placeholder="Введи свой логин"
                      required
                      minlength="3"
                    />
                  </div>
                  <div class="form__group">
                    <label for="password" class="form__label">Пароль:</label>
                    <input
                      class="form__input"
                      type="password"
                      id="password"
                      name="password"
                      placeholder="Введи свой пароль"
                      required
                      minlength="4"
                    />
                  </div>
                  <div class="form__group">
                    <label for="password-confirm" class="form__label"
                      >Пароль еще раз:</label
                    >
                    <input
                      class="form__input"
                      type="password"
                      id="password-confirm"
                      name="password-confirm"
                      placeholder="Повтори пароль"
                      required
                      minlength="4"
                    />
                  </div>
                  <button type="button" class="modal__close">&times;</button>
                  <button class="button center" type="submit">Подписаться</button>
                </form>
              </div>
            </div>
          </div>
          <div class="footer__navigation">
            <div class="footer__nav-title">Быстрые ссылки</div>
            <nav>
              <ul class="footer__nav clear-list">
                <li class="footer__nav-link">Главная</li>
                <li class="footer__nav-link">Магазин</li>
                <li class="footer__nav-link">Контакты</li>
              </ul>
            </nav>
          </div>
        </div>
        <p class="footer__contact center">www.product-cards.com©all right reserve</p>
      </footer>
    </main>
    <script type="module" src="./script/script.js"></script>
    <!-- <script src="./script/homework-7.js"></script>
    <script src="./script/homework-8.js"></script> -->
    <script type="module" src="./script/comments.js"></script>
    <script type="module" src="./script/homework-9.js"></script>
    <script type="module" src="./script/homework-10.js"></script>
    <script type="module" src="./script/homework-11.js"></script>
  </body>
</html>
