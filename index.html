<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style/style.css" />
    <link rel="stylesheet" href="./style/catalog.css" />
    <link rel="stylesheet" href="./style/heading.css" />
    <link rel="stylesheet" href="./style/buttons.css" />
    <link rel="stylesheet" href="./style/products.css" />
    <link rel="stylesheet" href="./style/card.css" />
    <title>Cards Training</title>
  </head>
  <body>
    <main class="catalog">
      <div class="catalog__container container">
        <h1 class="catalog__heading heading">Выбери свой продукт</h1>
        <div class="catalog__buttons">
          <button type="button" class="buttons__first button">
            Изменить цвет первой карточки
          </button>
          <button type="button" class="buttons__all button">
            Изменить цвет всех карточек
          </button>
          <button type="button" class="buttons__google button">
            Загуглить
          </button>
          <button type="button" class="buttons__reset button">Сбросить</button>
        </div>
        <ul class="catalog__products products clear-list">
          <template class="card__template">
            <li class="products__card card">
              <img src="" alt="Увлажняющий мусс" class="card__image" />
              <span class="card__type"></span>
              <h2 class="card__title"></h2>
              <p class="card__description text-main"></p>
              <div class="card__list">
                <span class="card__list-name text-main">Состав:</span>
                <ul class="card__list-items text-main">
                  <li></li>
                  <li></li>
                  <li></li>
                </ul>
              </div>
              <div class="card__price">
                <b>Цена</b>
                <span></span>
              </div>
              <button type="button" class="card__button button">
                В корзину
              </button>
            </li>
          </template>
        </ul>
      </div>
    </main>
    <script src="./script/script.js"></script>
    <!-- <script src="./script/homework-7.js"></script>
    <script src="./script/homework-8.js"></script> -->
    <script type="module" src="./script/homework-9.js"></script>
    <script type="module" src="./script/homework-10.js"></script>
    <script type="module" src="./script/comments.js"></script>
  </body>
</html>
